<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DnD Arcana Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/styles/style.css">
</head>
<body>
    <header class="site-header">
        <div class="branding">
            <div class="sigil" aria-hidden="true">⚚</div>
            <h1>ABAMA Shop</h1>
        </div>
        <div class="header-actions">
            <div class="search">
                <input id="searchInput" type="search" placeholder="Поиск артефактов..." aria-label="Поиск">
            </div>
<!--            <button id="cartButton" class="cart-btn" aria-label="Открыть корзину">-->
<!--                <span class="cart-icon">🛒</span>-->
<!--                <span id="cartCount" class="cart-count">0</span>-->
<!--            </button>-->
        </div>
    </header>

    <main class="container">
        <div class="filters">
            <div id="rarityChips" class="chips" role="radiogroup" aria-label="Фильтр по редкости">
                <button class="chip is-active" data-rarity="all" role="radio" aria-checked="true">Все</button>
                <button class="chip" data-rarity="common" role="radio" aria-checked="false">Обычное</button>
                <button class="chip" data-rarity="uncommon" role="radio" aria-checked="false">Необычное</button>
                <button class="chip" data-rarity="rare" role="radio" aria-checked="false">Редкое</button>
                <button class="chip" data-rarity="legendary" role="radio" aria-checked="false">Легендарное</button>
            </div>
            <div class="sort">
                <select id="sortSelect" aria-label="Сортировка">
                    <option value="popular">По популярности</option>
                    <option value="priceAsc">Цена: по возрастанию</option>
                    <option value="priceDesc">Цена: по убыванию</option>
                    <option value="nameAsc">Название: А-Я</option>
                    <option value="nameDesc">Название: Я-А</option>
                </select>
            </div>
        </div>
        <section id="productGrid" class="grid" aria-label="Список товаров"></section>
    </main>

    <aside id="cartDrawer" class="cart-drawer" aria-hidden="true" role="dialog" aria-label="Корзина покупок">
        <div class="cart-header">
            <h2>Корзина</h2>
            <button id="closeCart" class="ghost-btn" aria-label="Закрыть корзину">✕</button>
        </div>
        <div id="cartItems" class="cart-items"></div>
        <div class="cart-footer">
            <div class="total">
                <span>Итого:</span>
                <strong id="cartTotal">0</strong>
                <span class="currency">зл</span>
            </div>
            <button id="checkoutBtn" class="primary-btn">Оформить заказ</button>
        </div>
    </aside>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <canvas id="fxCanvas" class="fx-canvas" aria-hidden="true"></canvas>

    <script src="src/js/data.js"></script>
    <script src="src/js/app.js"></script>
</body>
</html>
